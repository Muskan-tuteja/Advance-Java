<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #667eea, #764ba2);
        }

        .login-box{
            width: 350px;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .login-box h2{
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-box{
            margin-bottom: 20px;
        }

        .input-box input{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            font-size: 16px;
        }

        .input-box input:focus{
            border-color: #667eea;
        }

        .btn{
            width: 100%;
            padding: 12px;
            border: none;
            background: #667eea;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover{
            background: #5a67d8;
        }

        .text{
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .text a{
            color: #667eea;
            text-decoration: none;
        }

    </style>
</head>
<body>

<div class="login-box">

    <h2>Login</h2>

    <form>

        <div class="input-box">
            <input type="email" placeholder="Enter Email">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Enter Password">
        </div>

        <button class="btn">Login</button>

        <p class="text">
            Don't have an account?
            <a href="#">Register</a>
        </p>

    </form>

</div>

</body>
</html>
