<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #758cff, #7e89ff);
        }

        .signup-box{
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .signup-box h2{
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-box{
            margin-bottom: 18px;
        }

        .input-box input{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus{
            border-color: blue;
        }

        .btn{
            width: 100%;
            padding: 12px;
            border: none;
            background: blue;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:hover{
            background: #6a4ee9;
        }

        .text{
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .text a{
            text-decoration: none;
            color: #758cff;
        }

    </style>
</head>
<body>

<div class="signup-box">

    <h2>Signup Form</h2>

    <form>

        <div class="input-box">
            <input type="text" placeholder="Full Name">
        </div>

        <div class="input-box">
            <input type="email" placeholder="Email Address">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Create Password">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Confirm Password">
        </div>

        <button class="btn">Sign Up</button>

        <p class="text">
            Already have an account?
            <a href="#">Login</a>
        </p>

    </form>

</div>

</body>
</html>
